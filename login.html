<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SmartPiggy</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="login-container">
        <div class="login-left">
            <div class="login-decorative">
                <div class="login-pig">🐷</div>
                <h1 style="font-size: 3rem; font-weight: 700; margin-bottom: 1rem;">SmartPiggy</h1>
                <p style="font-size: 1.25rem; text-align: center; max-width: 28rem; opacity: 0.8;">Your intelligent savings companion that scans, tracks, and grows your wealth</p>
                <div style="margin-top: 3rem; display: flex; gap: 1.5rem;">
                    <div style="text-align: center;">
                        <div style="font-size: 2.5rem; font-weight: 700;">500+</div>
                        <div style="font-size: 0.875rem; opacity: 0.7;">Notes Scanned</div>
                    </div>
                    <div style="width: 1px; background: rgba(255,255,255,0.3);"></div>
                    <div style="text-align: center;">
                        <div style="font-size: 2.5rem; font-weight: 700;">₹50K+</div>
                        <div style="font-size: 0.875rem; opacity: 0.7;">Total Saved</div>
                    </div>
                </div>
            </div>
        </div>
        <div class="login-right">
            <div class="login-form-container">
                <div class="login-header">
                    <h2>Welcome Back!</h2>
                    <p style="color: var(--muted-foreground);">Sign in to access your savings dashboard</p>
                </div>
                <form onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label class="form-label">Email</label>
                        <div class="form-input-wrapper">
                            <span class="input-icon">📧</span>
                            <input type="email" class="form-input" id="login-email" placeholder="demo@smartpiggy.com" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Password</label>
                        <div class="form-input-wrapper">
                            <span class="input-icon">🔒</span>
                            <input type="password" class="form-input" id="login-password" placeholder="••••••••" required>
                            <button type="button" class="toggle-password" onclick="togglePassword()">👁️</button>
                        </div>
                    </div>
                    <!-- Message display -->
                    <div id="login-message" class="message"></div>
                    <button type="submit" class="btn btn-primary btn-xl" style="width: 100%; margin-top: 1rem;">
                        <span id="login-btn-text">Sign In ✨</span>
                    </button>
                </form>
                <div class="demo-credentials">
                    <div class="demo-credentials-header">
                        <span>✨</span>
                        <div>
                            <p style="font-weight: 500; margin-bottom: 0.5rem;">Demo Credentials</p>
                            <p style="color: var(--muted-foreground);">Email: <code>demo@smartpiggy.com</code></p>
                            <p style="color: var(--muted-foreground);">Password: <code>demo123</code></p>
                        </div>
                    </div>
                </div>
                <div style="text-align: center; margin-top: 2rem;">
                    <a href="index.html" style="color: var(--muted-foreground); text-decoration: none; font-size: 0.875rem;">← Back to Home</a>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
